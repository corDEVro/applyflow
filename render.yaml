services:
  - type: web
    name: applyflow-backend
    runtime: java
    rootDir: applyflow-backend
    plan: free
    buildCommand: ./mvnw package
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://applyflow-cordevro.netlify.app
      - key: OPENROUTER_REFERER
        value: https://applyflow-cordevro.netlify.app
