# ApplyFlow Backend
# Sin base de datos ni SMTP: los datos de usuario viven en el localStorage
# del navegador. Este backend solo hace IA (OpenRouter), genera PDFs y
# extrae texto de .docx.
# Todas las credenciales se leen desde variables de entorno.
# Nunca commits secretos en este archivo.

# --- OpenRouter (motor de IA) ---
openrouter.api.key=${OPENROUTER_API_KEY:}

# --- CORS: orígenes permitidos (separados por comas) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- URL pública reportada a OpenRouter como referer ---
app.openrouter.referer=${OPENROUTER_REFERER:http://localhost:8080}

# --- Límites de subida de ficheros (para subir tu CV en .docx) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
