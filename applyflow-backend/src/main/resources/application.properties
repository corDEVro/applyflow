# ApplyFlow Backend
# Todas las credenciales se leen desde variables de entorno.
# Define las variables que necesites ANTES de arrancar (ver README).
# Nunca commits secretos en este archivo.

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applyflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# 'update' crea/actualiza tablas automáticamente (solo desarrollo).
# En producción usa 'validate' o migraciones.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- OpenRouter (motor de IA) ---
openrouter.api.key=${OPENROUTER_API_KEY:}

# --- Servidor de correo saliente (SMTP) ---
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS: orígenes permitidos (separados por comas) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- URL pública reportada a OpenRouter como referer ---
app.openrouter.referer=${OPENROUTER_REFERER:http://localhost:8080}
